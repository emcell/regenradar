name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The ignored tests need real DWD files on disk, so they stay out of CI.
      - run: cargo test --release --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  image:
    name: Image
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Both architectures are cross-compiled from the runner, never emulated:
      # building Rust under QEMU turns two minutes into half an hour.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  e2e:
    name: End-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The runner's own architecture only: this job is about behaviour. It also
      # warms the layer cache that the multi-arch publish reuses afterwards.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: regenradar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it
        run: |
          docker run -d --name regenradar -p 8787:8787 regenradar:ci
          # Ready means a DWD run has been fetched, decoded and reprojected.
          for i in $(seq 1 60); do
            if curl -sf localhost:8787/readyz >/dev/null; then
              echo "ready after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "::error::container never became ready"
          docker logs regenradar
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web

      # Against the real container and live DWD data. The parts most likely to
      # break — RADOLAN decoding, georeferencing, texture formats — are exactly the
      # ones a mocked fixture would hide.
      - run: npx playwright test
        working-directory: web
        env:
          REGENRADAR_BASE: http://127.0.0.1:8787

      - name: Container logs
        if: failure()
        run: docker logs regenradar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          path: web/e2e/.artifacts
          if-no-files-found: ignore
          retention-days: 7
