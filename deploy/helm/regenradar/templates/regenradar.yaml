{{- $fullname := printf "%s-%s" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $fullname }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $fullname }}
  template:
    metadata:
      labels:
        app: {{ $fullname }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.containerPort }}
          name: http
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        # Der Prozess schreibt nichts auf Platte -- kein tmpfs, kein Volume nötig.
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        startupProbe:
          exec:
            command: ["/usr/local/bin/regenradar", "--healthcheck"]
          {{- toYaml .Values.probes.startup | nindent 10 }}
        readinessProbe:
          exec:
            command: ["/usr/local/bin/regenradar", "--healthcheck"]
          {{- toYaml .Values.probes.readiness | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: http
          {{- toYaml .Values.probes.liveness | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $fullname }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: {{ $fullname }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ $fullname }}-tls
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fullname }}
            port:
              name: http
{{- end }}
{{- if .Values.gateway.enabled }}
---
# Gateway API (z. B. Envoy Gateway) neben – später statt – dem Ingress.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $fullname }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
  hostnames: [{{ .Values.ingress.host | quote }}]
  rules:
    - backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
{{- end }}
{{- if .Values.monitoring.enabled }}
---
# Prometheus (Operator-CRDs, z. B. kube-prometheus-stack) liest /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $fullname }}
spec:
  selector:
    matchLabels:
      app: {{ $fullname }}
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
---
# Der Prozess bleibt gesund, wenn der DWD Pfad oder Format ändert – er zeigt dann nur
# die letzte Vorhersage weiter. Darum der Alarm auf das Alter der Daten.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    app: {{ $fullname }}
spec:
  groups:
    - name: regenradar
      rules:
        - alert: RegenradarRadarStale
          expr: time() - max(regenradar_data_timestamp_seconds{source="radar", namespace="{{ .Release.Namespace }}"}) > {{ .Values.monitoring.radarMaxAgeMinutes }} * 60
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: {{ printf "Regenradar: Radardaten sind {{ $value | humanizeDuration }} alt" | quote }}
            description: "Der DWD-RV-Ingest kommt nicht mehr durch (Pfad oder Format geändert?). kubectl logs -n {{ .Release.Namespace }} deploy/{{ $fullname }}"
        - alert: RegenradarModelStale
          expr: time() - max(regenradar_data_timestamp_seconds{source="model", namespace="{{ .Release.Namespace }}"}) > {{ .Values.monitoring.modelMaxAgeHours }} * 3600
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: {{ printf "Regenradar: ICON-D2-Modell ist {{ $value | humanizeDuration }} alt" | quote }}
            description: "Der ICON-D2-Ingest kommt nicht mehr durch. kubectl logs -n {{ .Release.Namespace }} deploy/{{ $fullname }}"
        - alert: RegenradarNoData
          expr: absent(regenradar_data_timestamp_seconds{source="radar", namespace="{{ .Release.Namespace }}"})
          for: 30m
          labels: {severity: critical}
          annotations:
            summary: "Regenradar liefert keine Radardaten (oder wird nicht abgefragt)"
            description: "Seit 30 min keine Metrik regenradar_data_timestamp_seconds{source=radar}: Pod down, Ingest nie geglückt oder /metrics nicht erreichbar."
{{- end }}
